name: FRONT Build-Push Image and Deploy

on:
  push:
    branches:
      - dev-azure

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-front-v1-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login action
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Log in to Azure Container Registry
      run: az acr login --name registryapiback

    - name: Build and push Docker Image
      run: |
        docker build -f Dockerfile.DEV -t registryapiback.azurecr.io/myconnecttwebfront:dev-${{ github.sha }} .
        docker push registryapiback.azurecr.io/myconnecttwebfront:dev-${{ github.sha }}
      
    - name: Deploy App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'myconnectt-front-dev'
        images: 'registryapiback.azurecr.io/myconnecttwebfront:dev-${{ github.sha }}'
